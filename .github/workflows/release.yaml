name: MINGUI Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Сборка Debug конфигурации
    - name: Configure Debug
      run: cmake -B build-debug -DCMAKE_BUILD_TYPE=Debug

    - name: Build Debug
      run: cmake --build build-debug --config Debug

    # 2. Сборка Release конфигурации
    - name: Configure Release
      run: cmake -B build-release -DCMAKE_BUILD_TYPE=Release

    - name: Build Release
      run: cmake --build build-release --config Release

    # 3. Упаковка для Windows (PowerShell)
    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Создаем целевую иерархию папок
        New-Item -ItemType Directory -Path package/MINGUI/include/MINGUI -Force
        New-Item -ItemType Directory -Path package/MINGUI/bin -Force
        
        # Копируем только заголовочные папки (все директории из MINGUI, кроме 'src')
        Get-ChildItem -Path MINGUI -Directory | Where-Object { $_.Name -ne 'src' } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination package/MINGUI/include/MINGUI -Recurse -Force
        }
        
        # Копируем собранные .lib файлы в bin
        Get-ChildItem -Path build-debug, build-release -Filter "*.lib" -Recurse | Copy-Item -Destination package/MINGUI/bin
        
        # Архивируем корневую папку MINGUI
        Compress-Archive -Path package/MINGUI -DestinationPath mingui-windows-x64.zip

    # 4. Упаковка для Linux (Bash)
    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        # Создаем целевую иерархию папок
        mkdir -p package/MINGUI/include/MINGUI package/MINGUI/bin
        
        # Копируем заголовочные папки из MINGUI, пропуская src
        for dir in MINGUI/*/; do
            dirname=$(basename "$dir")
            if [ "$dirname" != "src" ]; then
                cp -r "$dir" package/MINGUI/include/MINGUI/
            fi
        done
        
        # Копируем собранные .a файлы в bin
        find build-debug build-release -name "*.a" -exec cp {} package/MINGUI/bin/ \;
        
        # Архивируем корневую папку MINGUI
        tar -czvf mingui-linux-x64.tar.gz -C package MINGUI

    # 5. Сохранение артефактов
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mingui-${{ runner.os }}
        path: |
          *.zip
          *.tar.gz

    # 6. Автоматический релиз на GitHub при пуше тегов (v*)
    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.zip
          *.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}